<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>星界塔罗 · Astral Tarot</title>
<meta name="description" content="宇宙星空风格的韦特塔罗牌在线占卜 —— 洗牌、抽卡、正逆位与详细牌义解读,纯前端,无需联网 AI。">
<meta name="theme-color" content="#070512">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星界塔罗">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Pirata+One&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="motes" id="motes"></div>

  <main class="app">
    <section id="scene-home"     class="scene active"></section>
    <section id="scene-question" class="scene"></section>
    <section id="scene-shuffle"  class="scene"></section>
    <section id="scene-pick"     class="scene"></section>
    <section id="scene-reading"  class="scene"></section>
  </main>

  <!-- 数据:78 张牌与解读(由 cards-data.js 提供),牌阵定义 -->
  <script src="js/cards-data.js"></script>
  <script src="js/spreads.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 生成飘落的金色微粒
    (function () {
      var m = document.getElementById("motes");
      var n = window.innerWidth < 640 ? 14 : 26;
      for (var i = 0; i < n; i++) {
        var d = document.createElement("div");
        d.className = "mote";
        d.style.left = Math.random() * 100 + "vw";
        d.style.animationDuration = (7 + Math.random() * 9) + "s";
        d.style.animationDelay = (-Math.random() * 12) + "s";
        var s = 2 + Math.random() * 3;
        d.style.width = d.style.height = s + "px";
        m.appendChild(d);
      }
    })();
    // Service worker(仅在 http/https 下注册,file:// 会失败,忽略)
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
